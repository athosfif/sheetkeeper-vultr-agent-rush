[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetkeeper"
version = "0.1.0"
description = "A preparation prototype for auditable CSV analysis in disposable sandboxes"
requires-python = ">=3.12"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
